server {
    listen 127.0.0.1:8443 ssl http2;
    server_name arandi-platform-staging.local;

    ssl_certificate /etc/arandi-platform/tls/staging.crt;
    ssl_certificate_key /etc/arandi-platform/tls/staging.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ArandiStagingTLS:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 11m;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    add_header Strict-Transport-Security "max-age=300" always;

    location = /api/health/live {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
    }

    location = /api/health/ready {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
    }

    location ^~ /media/ {
        root /srv/arandi-platform/shared;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/ai/chat {
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
