name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arandi_platform
          POSTGRES_USER: arandi_ci
          POSTGRES_PASSWORD: arandi_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arandi_ci -d arandi_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arandi_ci:arandi_ci_password@127.0.0.1:5432/arandi_platform?schema=public
      AUTH_TOKEN_PEPPER: ci-only-pepper-with-at-least-thirty-two-characters
      ARANDI_SITE_URL: https://arandi.ir
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
